[package]
name = "gui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "photosnorm_gui"
path = "src/main.rs"

[dependencies]
image.workspace = true

core = { path = "../core" }
eframe = { version = "0.30.0", features = [ "persistence" ] }
egui_extras = { version = "0.30.0", features = ["default", "all_loaders"] }
egui_taffy = "0.4.0"
rfd = "0.15.1"

[build-dependencies]
winresource = "0.1.19"
